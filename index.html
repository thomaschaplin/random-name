<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Random Name</title>
<meta name="description" content="Pull the lever and spin up a random name from over 277,000 first and last names.">
<meta name="theme-color" content="#1a0d14">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎰</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1a0d14;
    --bg-glow: #3b1226;
    --cabinet: #6b1530;
    --cabinet-dark: #3d0a1b;
    --gold: #f5c542;
    --gold-dark: #b8860b;
    --reel: #fff8e7;
    --reel-shade: #d9ccb0;
    --ink: #2a1a10;
    --text: #fbeee0;
    --muted: #c9a9b4;
    --red: #e23b3b;
    --cell: 76px;
    --ease-out: cubic-bezier(.2, .8, .2, 1);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    background:
      radial-gradient(ellipse at 50% 0%, var(--bg-glow) 0%, transparent 60%),
      var(--bg);
    color: var(--text);
    font-family: Inter, system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 40px;
    overflow-x: hidden;
    -webkit-tap-highlight-color: transparent;
  }

  button { font: inherit; color: inherit; cursor: pointer; }
  button:disabled { cursor: not-allowed; }
  :focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }

  /* ---------- Machine ---------- */
  .machine {
    position: relative;
    width: min(100%, 640px);
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 0;
    margin-top: 8px;
  }

  .cabinet {
    position: relative;
    background:
      linear-gradient(180deg, rgba(255,255,255,.12), transparent 30%),
      linear-gradient(180deg, var(--cabinet), var(--cabinet-dark));
    border-radius: 28px 28px 20px 20px;
    padding: 18px 18px 22px;
    box-shadow:
      inset 0 0 0 4px var(--gold-dark),
      inset 0 0 0 7px var(--gold),
      inset 0 2px 20px rgba(0,0,0,.4),
      0 30px 60px rgba(0,0,0,.6);
  }

  /* Marquee */
  .marquee {
    position: relative;
    margin: 0 auto 16px;
    padding: 14px 18px;
    border-radius: 18px;
    background: #12070c;
    box-shadow: inset 0 0 0 3px var(--gold-dark), inset 0 0 30px rgba(245,197,66,.15);
    text-align: center;
    overflow: hidden;
  }
  .marquee h1 {
    margin: 0;
    font-family: Bungee, Impact, sans-serif;
    font-weight: 400;
    font-size: clamp(26px, 7vw, 46px);
    letter-spacing: .04em;
    line-height: 1.05;
    color: var(--gold);
    text-shadow: 0 0 10px rgba(245,197,66,.6), 0 3px 0 var(--gold-dark);
  }
  .marquee p {
    margin: 6px 0 0;
    font-size: 13px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .bulbs {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .bulb {
    position: absolute;
    width: 8px; height: 8px;
    margin: -4px 0 0 -4px;
    border-radius: 50%;
    background: #fff3c4;
    box-shadow: 0 0 6px 2px rgba(255,214,102,.8);
    animation: chase 1.2s steps(1) infinite;
  }
  @keyframes chase {
    0%   { opacity: 1; }
    50%  { opacity: .2; box-shadow: none; }
  }
  .machine.jackpot .bulb { animation-duration: .25s; background: #fff; }

  /* Reels */
  .window {
    position: relative;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    padding: 12px;
    border-radius: 16px;
    background: linear-gradient(180deg, #0c0408, #22101a);
    box-shadow: inset 0 0 0 3px var(--gold-dark), inset 0 8px 24px rgba(0,0,0,.7);
  }
  .reel {
    position: relative;
    height: calc(var(--cell) * 3);
    overflow: hidden;
    border-radius: 10px;
    background: var(--reel);
    box-shadow: inset 0 0 0 2px var(--reel-shade);
  }
  /* curved-drum shading */
  .reel::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: linear-gradient(180deg,
      rgba(30,10,20,.75) 0%,
      rgba(30,10,20,.15) 28%,
      rgba(255,255,255,0) 40%,
      rgba(255,255,255,0) 60%,
      rgba(30,10,20,.15) 72%,
      rgba(30,10,20,.75) 100%);
  }
  .strip {
    will-change: transform;
  }
  .cell {
    height: var(--cell);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 10px;
    font-weight: 800;
    font-size: clamp(18px, 4.6vw, 28px);
    color: var(--ink);
    text-transform: capitalize;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    border-bottom: 1px dashed rgba(42,26,16,.12);
  }
  .cell span { overflow: hidden; text-overflow: ellipsis; }
  .reel.held { box-shadow: inset 0 0 0 3px var(--red); }
  .reel.held::before {
    content: "HELD";
    position: absolute;
    z-index: 2;
    top: 6px; right: 6px;
    padding: 2px 6px;
    border-radius: 4px;
    font: 11px/1.4 Bungee, sans-serif;
    letter-spacing: .06em;
    color: #fff;
    background: var(--red);
  }

  .payline {
    position: absolute;
    left: 0; right: 0;
    top: 50%;
    height: calc(var(--cell) + 4px);
    transform: translateY(-50%);
    pointer-events: none;
    border-top: 2px solid rgba(226,59,59,.85);
    border-bottom: 2px solid rgba(226,59,59,.85);
    transition: box-shadow .3s;
  }
  .payline::before, .payline::after {
    content: "";
    position: absolute;
    top: 50%;
    border: 9px solid transparent;
    transform: translateY(-50%);
  }
  .payline::before { left: -2px; border-left-color: var(--red); }
  .payline::after { right: -2px; border-right-color: var(--red); }
  .machine.win .payline {
    box-shadow: 0 0 0 9999px rgba(0,0,0,.0), 0 0 22px 4px rgba(245,197,66,.8);
    border-color: var(--gold);
  }

  /* Controls */
  .holds {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    padding: 12px 12px 0;
  }
  .hold-btn {
    padding: 8px 10px;
    border: 0;
    border-radius: 10px;
    background: #2a0f1b;
    box-shadow: inset 0 0 0 2px #5a2a3c, 0 4px 0 #12060b;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--muted);
    transition: transform .1s, box-shadow .1s, background .2s, color .2s;
  }
  .hold-btn:active { transform: translateY(3px); box-shadow: inset 0 0 0 2px #5a2a3c, 0 1px 0 #12060b; }
  .hold-btn[aria-pressed="true"] {
    background: var(--red);
    color: #fff;
    box-shadow: inset 0 0 0 2px #ff8a8a, 0 4px 0 #7a1515, 0 0 16px rgba(226,59,59,.6);
  }

  .actions {
    display: flex;
    gap: 10px;
    padding: 16px 12px 0;
  }
  .spin-btn {
    flex: 1;
    padding: 16px 20px;
    border: 0;
    border-radius: 14px;
    background: linear-gradient(180deg, #ffd966, var(--gold) 50%, #e0a91c);
    box-shadow: 0 6px 0 var(--gold-dark), 0 10px 20px rgba(0,0,0,.4), inset 0 2px 0 rgba(255,255,255,.6);
    font-family: Bungee, Impact, sans-serif;
    font-size: 24px;
    letter-spacing: .08em;
    color: #4a1a00;
    transition: transform .08s, box-shadow .08s, filter .2s;
  }
  .spin-btn:hover:not(:disabled) { filter: brightness(1.06); }
  .spin-btn:active:not(:disabled), .spin-btn.pressed {
    transform: translateY(5px);
    box-shadow: 0 1px 0 var(--gold-dark), 0 4px 10px rgba(0,0,0,.4), inset 0 2px 0 rgba(255,255,255,.6);
  }
  .spin-btn:disabled { filter: grayscale(.6) brightness(.8); }
  .icon-btn {
    width: 58px;
    border: 0;
    border-radius: 14px;
    background: #2a0f1b;
    box-shadow: inset 0 0 0 2px #5a2a3c, 0 6px 0 #12060b;
    display: grid;
    place-items: center;
    transition: transform .08s, box-shadow .08s;
  }
  .icon-btn:active:not(:disabled) { transform: translateY(5px); box-shadow: inset 0 0 0 2px #5a2a3c, 0 1px 0 #12060b; }
  .icon-btn:disabled { opacity: .5; }
  .icon-btn svg { width: 24px; height: 24px; }

  .status {
    min-height: 1.4em;
    margin: 14px 12px 0;
    text-align: center;
    font-size: 14px;
    color: var(--muted);
  }
  .status strong { color: var(--gold); }

  /* Lever */
  .lever {
    position: relative;
    width: 56px;
    margin-left: -6px;
    display: flex;
    justify-content: center;
    touch-action: none;
    user-select: none;
  }
  .lever-mount {
    position: absolute;
    top: 46%;
    left: -2px;
    width: 34px;
    height: 74px;
    border-radius: 0 14px 14px 0;
    background: linear-gradient(90deg, #8a8a8a, #e0e0e0 40%, #7a7a7a);
    box-shadow: 0 4px 10px rgba(0,0,0,.5);
  }
  .lever-arm {
    position: absolute;
    left: 16px;
    top: 10%;
    width: 12px;
    height: calc(46% - 10% + 36px);
    transform-origin: 50% 100%;
    border-radius: 6px;
    background: linear-gradient(90deg, #6f6f6f, #f2f2f2 45%, #808080);
    transition: transform .45s cubic-bezier(.3, 1.6, .5, 1);
  }
  .lever-knob {
    position: absolute;
    left: 50%;
    top: -26px;
    width: 46px;
    height: 46px;
    margin-left: -23px;
    border: 0;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #ff9a9a, var(--red) 45%, #8b1010);
    box-shadow: 0 6px 14px rgba(0,0,0,.5), inset 0 -4px 8px rgba(0,0,0,.3);
    cursor: grab;
    touch-action: none;
  }
  .lever-knob:active { cursor: grabbing; }
  .lever.dragging .lever-arm { transition: none; }

  /* History */
  .history {
    width: min(100%, 640px);
    margin-top: 28px;
  }
  .history-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 10px;
  }
  .history h2 {
    margin: 0;
    font-family: Bungee, Impact, sans-serif;
    font-weight: 400;
    font-size: 16px;
    letter-spacing: .08em;
    color: var(--gold);
  }
  .link-btn {
    border: 0;
    background: none;
    padding: 4px 0;
    font-size: 13px;
    color: var(--muted);
    text-decoration: underline;
    text-underline-offset: 3px;
  }
  .chips {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .chips:empty::before {
    content: "Spin to start your collection.";
    color: var(--muted);
    font-size: 14px;
  }
  .chip {
    padding: 8px 12px;
    border: 0;
    border-radius: 999px;
    background: #2a0f1b;
    box-shadow: inset 0 0 0 1px #5a2a3c;
    font-size: 14px;
    font-weight: 600;
    text-transform: capitalize;
    animation: chip-in .35s var(--ease-out);
    transition: background .2s, box-shadow .2s;
  }
  .chip:hover { background: #3a1626; box-shadow: inset 0 0 0 1px var(--gold-dark); }
  .chip.gold { box-shadow: inset 0 0 0 1px var(--gold); color: var(--gold); }
  @keyframes chip-in {
    from { opacity: 0; transform: translateY(-6px) scale(.9); }
  }

  /* Footer */
  footer {
    width: min(100%, 640px);
    margin-top: 36px;
    padding-top: 20px;
    border-top: 1px solid #3a1626;
    font-size: 14px;
    color: var(--muted);
  }
  footer code {
    display: block;
    margin: 8px 0 14px;
    padding: 12px 14px;
    border-radius: 10px;
    background: #12070c;
    color: var(--text);
    font-size: 13px;
    overflow-x: auto;
  }
  footer a { color: var(--gold); }
  .kbd-hint { margin-top: 10px; font-size: 12px; }
  kbd {
    padding: 1px 6px;
    border-radius: 4px;
    background: #2a0f1b;
    box-shadow: inset 0 -1px 0 #5a2a3c;
    font: 12px Inter, sans-serif;
  }

  /* Toast */
  .toast {
    position: fixed;
    left: 50%;
    bottom: 24px;
    padding: 10px 18px;
    border-radius: 999px;
    background: var(--gold);
    color: #4a1a00;
    font-weight: 800;
    font-size: 14px;
    box-shadow: 0 10px 30px rgba(0,0,0,.4);
    transform: translate(-50%, 120px);
    transition: transform .35s var(--ease-out);
    pointer-events: none;
    z-index: 10;
  }
  .toast.show { transform: translate(-50%, 0); }

  /* Coins */
  .coin {
    position: fixed;
    z-index: 5;
    width: 18px; height: 18px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff1b0, var(--gold) 50%, var(--gold-dark));
    box-shadow: inset 0 0 0 2px rgba(184,134,11,.7);
    pointer-events: none;
  }

  .machine.shake { animation: shake .35s; }
  @keyframes shake {
    25% { transform: translateX(-6px); }
    50% { transform: translateX(5px); }
    75% { transform: translateX(-3px); }
  }

  .sr-only {
    position: absolute;
    width: 1px; height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
  }

  @media (max-width: 480px) {
    :root { --cell: 60px; }
    .marquee p { font-size: 11px; letter-spacing: .08em; }
    .cabinet { padding: 12px 12px 16px; border-radius: 22px 22px 16px 16px; }
    .window { padding: 8px; gap: 6px; }
    .holds, .actions { padding-left: 8px; padding-right: 8px; }
    .lever { width: 40px; }
    .lever-knob { width: 36px; height: 36px; margin-left: -18px; top: -20px; }
    .lever-arm { width: 10px; left: 10px; }
    .lever-mount { width: 26px; }
    .spin-btn { font-size: 20px; padding: 14px; }
    .icon-btn { width: 50px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .bulb, .machine.jackpot .bulb { animation: none; }
    .chip { animation: none; }
    .lever-arm { transition: none; }
  }
</style>
</head>
<body>

<div class="machine" id="machine">
  <div class="cabinet">
    <header class="marquee">
      <div class="bulbs" id="bulbs" aria-hidden="true"></div>
      <h1>Random Name</h1>
      <p id="tagline">Loading names…</p>
    </header>

    <div class="window">
      <div class="reel" id="reel-0" aria-hidden="true"><div class="strip"></div></div>
      <div class="reel" id="reel-1" aria-hidden="true"><div class="strip"></div></div>
      <div class="payline" aria-hidden="true"></div>
    </div>

    <div class="holds">
      <button class="hold-btn" id="hold-0" aria-pressed="false" disabled>Hold first</button>
      <button class="hold-btn" id="hold-1" aria-pressed="false" disabled>Hold last</button>
    </div>

    <div class="actions">
      <button class="spin-btn" id="spin" disabled>Spin</button>
      <button class="icon-btn" id="copy" aria-label="Copy name" title="Copy name" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
      </button>
      <button class="icon-btn" id="sound" aria-label="Sound off" aria-pressed="false" title="Toggle sound">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path class="wave" d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13" style="display:none"/><path class="mute" d="m16 9 5 6m0-6-5 6"/></svg>
      </button>
    </div>

    <p class="status" id="status" aria-live="polite"></p>
  </div>

  <div class="lever" id="lever">
    <div class="lever-mount"></div>
    <div class="lever-arm" id="lever-arm">
      <button class="lever-knob" id="lever-knob" aria-label="Pull the lever to spin" disabled></button>
    </div>
  </div>
</div>

<section class="history" aria-labelledby="history-title">
  <div class="history-head">
    <h2 id="history-title">Winnings</h2>
    <button class="link-btn" id="clear-history">Clear</button>
  </div>
  <ul class="chips" id="history"></ul>
</section>

<footer>
  Use it in your own project:
  <code>npm i @thomaschaplin/random-name</code>
  Made by <a href="https://github.com/thomaschaplin">Thomas Chaplin</a> ·
  <a href="https://github.com/thomaschaplin/random-name">Source on GitHub</a> ·
  <a href="https://www.npmjs.com/package/@thomaschaplin/random-name">npm</a>
  <div class="kbd-hint"><kbd>Space</kbd> spin · <kbd>1</kbd> / <kbd>2</kbd> hold a reel · <kbd>C</kbd> copy</div>
</footer>

<div class="toast" id="toast" role="status"></div>

<script>
(() => {
  'use strict';

  const $ = (id) => document.getElementById(id);
  const machine = $('machine');
  const spinBtn = $('spin');
  const copyBtn = $('copy');
  const soundBtn = $('sound');
  const statusEl = $('status');
  const historyEl = $('history');
  const reels = [$('reel-0'), $('reel-1')];
  const holdBtns = [$('hold-0'), $('hold-1')];
  const lever = $('lever');
  const leverArm = $('lever-arm');
  const leverKnob = $('lever-knob');

  const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const lists = [[], []];
  const current = ['thomas', 'chaplin'];
  const held = [false, false];
  let spinning = false;
  let soundOn = false;
  let history = [];

  const store = {
    get(key, fallback) {
      try { const v = localStorage.getItem(key); return v === null ? fallback : JSON.parse(v); }
      catch { return fallback; }
    },
    set(key, value) {
      try { localStorage.setItem(key, JSON.stringify(value)); } catch {}
    }
  };

  const pick = (list) => list[Math.floor(Math.random() * list.length)];
  const cellHeight = () => parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--cell'));

  /* ---------- Marquee bulbs ---------- */
  function placeBulbs() {
    const box = $('bulbs');
    box.innerHTML = '';
    const { width, height } = box.getBoundingClientRect();
    const gap = 22;
    const pts = [];
    const nx = Math.max(2, Math.round(width / gap));
    const ny = Math.max(2, Math.round(height / gap));
    for (let i = 0; i < nx; i++) pts.push([(i + .5) / nx * width, 6]);
    for (let i = 0; i < ny; i++) pts.push([width - 6, (i + .5) / ny * height]);
    for (let i = nx - 1; i >= 0; i--) pts.push([(i + .5) / nx * width, height - 6]);
    for (let i = ny - 1; i >= 0; i--) pts.push([6, (i + .5) / ny * height]);
    pts.forEach(([x, y], i) => {
      const b = document.createElement('span');
      b.className = 'bulb';
      b.style.left = x + 'px';
      b.style.top = y + 'px';
      b.style.animationDelay = (i % 2 ? -0.6 : 0) + 's';
      box.appendChild(b);
    });
  }

  /* ---------- Reels ---------- */
  function cell(name) {
    const d = document.createElement('div');
    d.className = 'cell';
    const s = document.createElement('span');
    s.textContent = name;
    d.appendChild(s);
    return d;
  }

  function setStrip(reel, names) {
    const strip = reel.querySelector('.strip');
    strip.replaceChildren(...names.map(cell));
    strip.style.transform = 'translateY(0)';
    return strip;
  }

  function spinReel(i, finalName, duration) {
    const reel = reels[i];
    const strip = reel.querySelector('.strip');
    const visible = [...strip.children].map((c) => c.textContent);
    const list = lists[i];
    const count = reducedMotion ? 3 : Math.round(duration / 45);
    const names = [visible[0], visible[1], visible[2]];
    for (let k = 0; k < count; k++) names.push(pick(list));
    const finalIndex = names.length;
    names.push(finalName, pick(list));
    setStrip(reel, names);

    const h = cellHeight();
    const end = -(finalIndex - 1) * h;

    if (reducedMotion) {
      const anim = strip.animate(
        [{ transform: 'translateY(0)', opacity: 1 }, { transform: `translateY(${end}px)`, opacity: 1 }],
        { duration: 250, easing: 'ease-out', fill: 'forwards' }
      );
      return anim.finished.then(() => settle(reel, names, finalIndex));
    }

    const anim = strip.animate([
      { transform: 'translateY(0)', filter: 'blur(0)', offset: 0 },
      { transform: `translateY(${h * 0.18}px)`, filter: 'blur(0)', offset: 0.06, easing: 'ease-in' },
      { transform: `translateY(${end * 0.25}px)`, filter: 'blur(2.5px)', offset: 0.3, easing: 'linear' },
      { transform: `translateY(${end * 0.85}px)`, filter: 'blur(1.5px)', offset: 0.72, easing: 'cubic-bezier(.2,.7,.3,1)' },
      { transform: `translateY(${end - h * 0.14}px)`, filter: 'blur(0)', offset: 0.92, easing: 'ease-in-out' },
      { transform: `translateY(${end}px)`, filter: 'blur(0)', offset: 1 }
    ], { duration, fill: 'forwards' });

    // Tick sounds as names pass the payline
    if (soundOn) {
      let last = 0;
      const tick = () => {
        if (anim.playState !== 'running') return;
        const y = new DOMMatrixReadOnly(getComputedStyle(strip).transform).m42;
        const idx = Math.floor(-y / h);
        if (idx !== last) { last = idx; beep(1400 + Math.random() * 200, 0.015, 0.03); }
        requestAnimationFrame(tick);
      };
      requestAnimationFrame(tick);
    }

    return anim.finished.then(() => {
      beep(220, 0.08, 0.12, 'square');
      settle(reel, names, finalIndex);
    });
  }

  function settle(reel, names, finalIndex) {
    const strip = setStrip(reel, [names[finalIndex - 1], names[finalIndex], names[finalIndex + 1]]);
    strip.getAnimations().forEach((a) => a.cancel());
    reel.animate(
      [{ transform: 'translateY(0)' }, { transform: 'translateY(2px)' }, { transform: 'translateY(0)' }],
      { duration: 160, easing: 'ease-out' }
    );
  }

  /* ---------- Spin ---------- */
  async function spin() {
    if (spinning || !lists[0].length) return;
    if (held[0] && held[1]) {
      setStatus('Both reels are held — release one to spin.');
      machine.classList.remove('shake');
      void machine.offsetWidth;
      machine.classList.add('shake');
      return;
    }
    spinning = true;
    setControls();
    machine.classList.remove('win', 'jackpot');
    setStatus('Spinning…');
    beep(330, 0.06, 0.08, 'triangle');

    const jobs = [];
    let delay = 1300;
    for (let i = 0; i < 2; i++) {
      if (held[i]) continue;
      current[i] = pick(lists[i]);
      jobs.push(spinReel(i, current[i], reducedMotion ? 250 : delay));
      delay += 650;
    }
    await Promise.all(jobs);

    spinning = false;
    setControls();
    const full = current.join(' ');
    const jackpot = current[0][0] === current[1][0];
    machine.classList.add('win');
    if (jackpot) {
      machine.classList.add('jackpot');
      setStatus(`<strong>Jackpot!</strong> Alliteration: ${titleCase(full)}`);
      celebrate();
    } else {
      setStatus(`You got <strong>${titleCase(full)}</strong>`);
    }
    addHistory(full, jackpot);
  }

  function titleCase(s) {
    return s.replace(/(^|[\s'-])(\p{L})/gu, (m, a, b) => a + b.toUpperCase());
  }

  function setStatus(html) { statusEl.innerHTML = html; }

  function setControls() {
    const ready = lists[0].length > 0;
    spinBtn.disabled = !ready || spinning;
    leverKnob.disabled = !ready || spinning;
    copyBtn.disabled = !ready || spinning;
    holdBtns.forEach((b) => (b.disabled = !ready || spinning));
    spinBtn.textContent = spinning ? 'Spinning' : 'Spin';
  }

  function toggleHold(i) {
    if (spinning || !lists[0].length) return;
    held[i] = !held[i];
    holdBtns[i].setAttribute('aria-pressed', held[i]);
    reels[i].classList.toggle('held', held[i]);
    beep(held[i] ? 660 : 440, 0.05, 0.06, 'triangle');
  }

  /* ---------- Lever ---------- */
  function pullLever() {
    if (spinning || leverKnob.disabled) return;
    leverArm.style.transform = 'scaleY(-0.55)';
    setTimeout(() => (leverArm.style.transform = ''), 260);
    spin();
  }

  (() => {
    let startY = 0, dragging = false, travel = 0, moved = false;
    const max = () => leverArm.offsetHeight * 1.5;
    leverKnob.addEventListener('pointerdown', (e) => {
      if (leverKnob.disabled) return;
      dragging = true; moved = false;
      startY = e.clientY;
      travel = 0;
      lever.classList.add('dragging');
      leverKnob.setPointerCapture(e.pointerId);
    });
    leverKnob.addEventListener('pointermove', (e) => {
      if (!dragging) return;
      travel = Math.max(0, Math.min(max(), e.clientY - startY));
      if (travel > 4) moved = true;
      const s = 1 - (travel / max()) * 1.55;
      leverArm.style.transform = `scaleY(${s})`;
    });
    const end = () => {
      if (!dragging) return;
      dragging = false;
      lever.classList.remove('dragging');
      const pulled = travel / max() > 0.45;
      leverArm.style.transform = '';
      if (pulled) spin();
    };
    leverKnob.addEventListener('pointerup', end);
    leverKnob.addEventListener('pointercancel', end);
    leverKnob.addEventListener('click', () => { if (!moved) pullLever(); });
  })();

  /* ---------- History & copy ---------- */
  function renderHistory() {
    historyEl.replaceChildren(...history.map(({ name, gold }) => {
      const li = document.createElement('li');
      const b = document.createElement('button');
      b.className = 'chip' + (gold ? ' gold' : '');
      b.textContent = name;
      b.title = 'Copy';
      b.addEventListener('click', () => copy(titleCase(name)));
      li.appendChild(b);
      return li;
    }));
  }

  function addHistory(name, gold) {
    history.unshift({ name, gold });
    history = history.slice(0, 24);
    store.set('rn-history', history);
    renderHistory();
  }

  async function copy(text) {
    try {
      await navigator.clipboard.writeText(text);
    } catch {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); } catch {}
      ta.remove();
    }
    toast(`Copied “${text}”`);
  }

  let toastTimer;
  function toast(msg) {
    const t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 1600);
  }

  /* ---------- Sound ---------- */
  let ctx;
  function beep(freq, vol, len, type = 'sine') {
    if (!soundOn) return;
    try {
      ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = type;
      o.frequency.value = freq;
      g.gain.setValueAtTime(vol, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + len);
      o.connect(g).connect(ctx.destination);
      o.start();
      o.stop(ctx.currentTime + len);
    } catch {}
  }

  function setSound(on) {
    soundOn = on;
    soundBtn.setAttribute('aria-pressed', on);
    soundBtn.setAttribute('aria-label', on ? 'Sound on' : 'Sound off');
    soundBtn.querySelector('.wave').style.display = on ? '' : 'none';
    soundBtn.querySelector('.mute').style.display = on ? 'none' : '';
    store.set('rn-sound', on);
  }

  /* ---------- Celebration ---------- */
  function celebrate() {
    [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, 0.08, 0.25, 'triangle'), i * 110));
    if (reducedMotion) return;
    const rect = machine.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height * 0.45;
    for (let i = 0; i < 36; i++) {
      const c = document.createElement('div');
      c.className = 'coin';
      document.body.appendChild(c);
      const angle = -Math.PI / 2 + (Math.random() - 0.5) * Math.PI * 1.2;
      const speed = 260 + Math.random() * 260;
      const dx = Math.cos(angle) * speed;
      const dy = Math.sin(angle) * speed;
      const fall = 500 + Math.random() * 300;
      c.style.left = cx + 'px';
      c.style.top = cy + 'px';
      c.animate([
        { transform: 'translate(-50%,-50%) scale(.6) rotateY(0)', opacity: 1 },
        { transform: `translate(calc(-50% + ${dx * 0.6}px), calc(-50% + ${dy * 0.6}px)) scale(1) rotateY(360deg)`, opacity: 1, offset: 0.4 },
        { transform: `translate(calc(-50% + ${dx}px), calc(-50% + ${dy + fall}px)) scale(.9) rotateY(900deg)`, opacity: 0 }
      ], { duration: 1300 + Math.random() * 500, easing: 'cubic-bezier(.2,.6,.4,1)' }).finished.then(() => c.remove());
    }
  }

  /* ---------- Wiring ---------- */
  spinBtn.addEventListener('click', spin);
  copyBtn.addEventListener('click', () => copy(titleCase(current.join(' '))));
  soundBtn.addEventListener('click', () => { setSound(!soundOn); beep(880, 0.05, 0.08, 'triangle'); });
  holdBtns.forEach((b, i) => b.addEventListener('click', () => toggleHold(i)));
  $('clear-history').addEventListener('click', () => { history = []; store.set('rn-history', history); renderHistory(); });

  document.addEventListener('keydown', (e) => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const tag = document.activeElement && document.activeElement.tagName;
    if (e.code === 'Space' && tag !== 'BUTTON') { e.preventDefault(); spin(); }
    else if (e.key === '1') toggleHold(0);
    else if (e.key === '2') toggleHold(1);
    else if (e.key === 'c' || e.key === 'C') { if (!copyBtn.disabled) copy(titleCase(current.join(' '))); }
  });

  let resizeTimer;
  addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(placeBulbs, 150); });

  // Initial state
  setStrip(reels[0], ['anna', current[0], 'grace']);
  setStrip(reels[1], ['smith', current[1], 'jones']);
  setSound(store.get('rn-sound', false));
  history = store.get('rn-history', []);
  if (!Array.isArray(history)) history = [];
  renderHistory();
  placeBulbs();
  setControls();

  Promise.all(['firstnames.json', 'lastnames.json'].map((f) => fetch(f).then((r) => {
    if (!r.ok) throw new Error(r.status);
    return r.json();
  }))).then(([first, last]) => {
    lists[0] = first;
    lists[1] = last;
    const total = (first.length + last.length).toLocaleString();
    $('tagline').textContent = `${total} names · pull to play`;
    setStatus('Pull the lever or hit <strong>Spin</strong>');
    setControls();
  }).catch(() => {
    $('tagline').textContent = 'Out of order';
    setStatus('Couldn’t load the name lists. Refresh to try again.');
  });
})();
</script>
</body>
</html>
